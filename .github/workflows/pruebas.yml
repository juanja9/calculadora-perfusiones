# Ejecuta la prueba automática de la calculadora en cada PR y en cada cambio de main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculadora:
    name: Cálculos, avisos y vista móvil
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar la herramienta de pruebas
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Probar la calculadora
        # Usa el Chrome que ya trae la máquina de GitHub: no descarga ni instala nada más
        run: node tests/pruebas.js
        env:
          NAVEGADOR: chrome
