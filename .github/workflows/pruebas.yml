# Ejecuta la prueba automática de la calculadora en cada PR y en cada cambio de main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculadora:
    name: Cálculos, avisos y vista móvil
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar el navegador de pruebas
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Probar la calculadora
        run: node tests/pruebas.js
